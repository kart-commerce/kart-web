name: CI

# Calls kart-devops's reusable workflows rather than hardcoding CI steps
# (kart-conventions.md: hardcoding per-service CI guarantees drift across
# repos) — the same pattern every kart-<name>-service repo uses.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint, test, build (Angular App CI)
    uses: kart-commerce/kart-devops/.github/workflows/angular-app-ci.yml@main
    with:
      node-version: '22.x'
      working-directory: .
      run-docker-build: true

  i18n-completeness:
    name: Translation completeness gate (WEB-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node scripts/check-translation-completeness.mjs

  category-client-codegen:
    name: Verify generated category-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-category-service.api-contract.yaml
      output-dir: src/app/core/http/generated/category/v1
      fail-on-diff: true

  cart-client-codegen:
    name: Verify generated cart-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-cart-service.api-contract.yaml
      output-dir: src/app/core/http/generated/cart/v1
      fail-on-diff: true

  delivery-tracking-client-codegen:
    name: Verify generated delivery-tracking-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-delivery-tracking-service.api-contract.yaml
      output-dir: src/app/core/http/generated/delivery-tracking/v1
      fail-on-diff: true

  identity-client-codegen:
    name: Verify generated identity-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-identity-service.api-contract.yaml
      output-dir: src/app/core/http/generated/identity/v1
      fail-on-diff: true

  inventory-client-codegen:
    name: Verify generated inventory-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-inventory-service.api-contract.yaml
      output-dir: src/app/core/http/generated/inventory/v1
      fail-on-diff: true

  notification-client-codegen:
    name: Verify generated notification-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-notification-service.api-contract.yaml
      output-dir: src/app/core/http/generated/notification/v1
      fail-on-diff: true

  # NOTE: offer/order/payment/review/shipping's api-contract.yaml each currently fail
  # openapi-generator-cli's strict spec validation (missing response `description` fields —
  # a pre-existing gap in those services' own contracts, not a kart-web defect). The generated
  # clients committed in this repo were produced locally with --skip-validate-spec, which this
  # reusable workflow does not expose as an input. Until the owning service teams add the
  # missing descriptions (tracked with each team, not re-litigated here), these five jobs are
  # expected to fail at the generate step rather than the intended drift-check step — flagged
  # here rather than silently omitted so it isn't mistaken for a kart-web regression.
  offer-client-codegen:
    name: Verify generated offer-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-offer-service.api-contract.yaml
      output-dir: src/app/core/http/generated/offer/v1
      fail-on-diff: true

  order-client-codegen:
    name: Verify generated order-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-order-service.api-contract.yaml
      output-dir: src/app/core/http/generated/order/v1
      fail-on-diff: true

  payment-client-codegen:
    name: Verify generated payment-service client is up to date
    uses: kart-commerce/kart-devops/.github/workflows/openapi-client-codegen.yml@main
    with:
      contract-path: contracts/kart-payment-service.api-contract.yaml
      output-dir: src/app/core/http/generated/payment/v1

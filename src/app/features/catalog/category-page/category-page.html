<section class="kart-category-page">
  <div class="kart-category-page__header">
    <h1>{{ categoryName() }}</h1>

    <div class="kart-category-page__controls">
      @if (availableBrands().length > 1) {
        <label class="kart-category-page__sort">
          Brand
          <select
            kartInput
            [value]="selectedBrand() ?? ''"
            (change)="changeBrand($any($event.target).value || null)"
          >
            <option value="">All brands</option>
            @for (brand of availableBrands(); track brand) {
              <option [value]="brand">{{ brand }}</option>
            }
          </select>
        </label>
      }

      <label class="kart-category-page__sort">
        Sort by
        <select
          kartInput
          [value]="sort()"
          (change)="changeSort($any($event.target).value)"
        >
          <option value="relevance">Relevance</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Customer rating</option>
        </select>
      </label>
    </div>
  </div>

  @if (products(); as items) {
    @if (items.length === 0) {
      <p class="kart-category-page__empty">No products in this category yet.</p>
    } @else {
      <div class="kart-category-page__grid">
        @for (product of items; track product.sku) {
          <kart-product-card [product]="product" />
        }
      </div>
    }
  } @else {
    <kart-spinner label="Loading products" />
  }
</section>

<section class="kart-search-page">
  <h1>Search results for &ldquo;{{ query() }}&rdquo;</h1>

  @if (results(); as items) {
    @if (items.length === 0) {
      <div class="kart-search-page__empty">
        <svg class="kart-search-page__empty-icon" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true" fill="none">
          <circle cx="42" cy="42" r="26" stroke="currentColor" stroke-width="4" />
          <line x1="61" y1="61" x2="82" y2="82" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        </svg>
        <p>No products matched &ldquo;{{ query() }}&rdquo;. Try a different search term.</p>
      </div>
    } @else {
      <p class="kart-search-page__count">{{ items.length }} result{{ items.length === 1 ? '' : 's' }}</p>
      <div class="kart-search-page__grid">
        @for (product of items; track product.sku) {
          <kart-product-card [product]="product" />
        }
      </div>
    }
  } @else {
    <kart-spinner label="Searching" />
  }
</section>

<section class="kart-auth-page">
  <h1>Log in</h1>

  @if (socialLoginFailed()) {
    <kart-alert variant="danger">{{ socialLoginErrorMessage }}</kart-alert>
  }
  @if (errorMessage(); as message) {
    <kart-alert variant="danger">{{ message }}</kart-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <kart-form-field
      label="Email"
      inputId="login-email"
      [error]="form.controls.email.touched && form.controls.email.invalid ? 'Enter a valid email address.' : null"
    >
      <input kartInput id="login-email" type="email" formControlName="email" autocomplete="email" required />
    </kart-form-field>

    <kart-form-field label="Password" inputId="login-password">
      <input
        kartInput
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />
    </kart-form-field>

    <kart-button type="submit" [loading]="submitting()">Log in</kart-button>
  </form>

  <p><a [href]="socialLoginUrl('google')">Continue with Google</a></p>

  <p>
    <a routerLink="/account/password-reset">Forgot your password?</a>
  </p>
  <p>Don't have an account? <a routerLink="/account/register">Create one</a></p>
</section>

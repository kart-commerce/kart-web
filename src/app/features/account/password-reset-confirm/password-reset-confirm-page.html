<section class="kart-auth-page">
  <h1>Choose a new password</h1>

  @if (errorMessage(); as message) {
    <kart-alert variant="danger">{{ message }}</kart-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <kart-form-field
      label="New password"
      inputId="new-password"
      [error]="
        form.controls.newPassword.touched && form.controls.newPassword.invalid
          ? 'Password must be at least 8 characters.'
          : null
      "
    >
      <input
        kartInput
        id="new-password"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        required
      />
    </kart-form-field>

    <kart-button type="submit" [loading]="submitting()">Set new password</kart-button>
  </form>

  <p><a routerLink="/account/login">Back to log in</a></p>
</section>

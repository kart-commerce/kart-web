<section class="kart-auth-page">
  <h1>Reset your password</h1>

  @if (submitted()) {
    <p>If that email is registered, we've sent password reset instructions to it.</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <kart-form-field
        label="Email"
        inputId="reset-email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Enter a valid email address.' : null"
      >
        <input kartInput id="reset-email" type="email" formControlName="email" autocomplete="email" required />
      </kart-form-field>

      <kart-button type="submit" [loading]="submitting()">Send reset instructions</kart-button>
    </form>
  }

  <p><a routerLink="/account/login">Back to log in</a></p>
</section>

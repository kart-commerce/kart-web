<section class="kart-auth-page">
  <h1>Create your account</h1>

  @if (errorMessage(); as message) {
    <kart-alert variant="danger">{{ message }}</kart-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <kart-form-field label="Display name (optional)" inputId="register-display-name">
      <input kartInput id="register-display-name" type="text" formControlName="displayName" autocomplete="name" />
    </kart-form-field>

    <kart-form-field
      label="Email"
      inputId="register-email"
      [error]="form.controls.email.touched && form.controls.email.invalid ? 'Enter a valid email address.' : null"
    >
      <input kartInput id="register-email" type="email" formControlName="email" autocomplete="email" required />
    </kart-form-field>

    <kart-form-field
      label="Password"
      inputId="register-password"
      [error]="
        form.controls.password.touched && form.controls.password.invalid
          ? 'Password must be at least 8 characters.'
          : null
      "
    >
      <input
        kartInput
        id="register-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
      />
    </kart-form-field>

    <kart-button type="submit" [loading]="submitting()">Create account</kart-button>
  </form>

  <p>Already have an account? <a routerLink="/account/login">Log in</a></p>
</section>
